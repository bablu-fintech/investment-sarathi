<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>

        Financial Health Score

    </title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="css/health.css">

</head>

<body>

<section class="health">

<div class="container">

<div class="title">

<span>

AI Powered

</span>

<h1>

Financial Health Score

</h1>

<p>

Know your Financial Fitness in less than 60 seconds.

</p>

</div>

<div class="health-wrapper">

<!-- LEFT -->

<div class="health-form">

<h2>

Enter Your Details

</h2>

<div class="input-group">

<label>

Monthly Income (₹)

</label>

<input
type="number"
id="income"
value="50000">

</div>

<div class="input-group">

<label>

Monthly Expense (₹)

</label>

<input
type="number"
id="expense"
value="30000">

</div>

<div class="input-group">

<label>

Emergency Fund (₹)

</label>

<input
type="number"
id="emergency"
value="100000">

</div>

<div class="input-group">

<label>

Investment Value (₹)

</label>

<input
type="number"
id="investment"
value="500000">

</div>

<div class="input-group">

<label>

Insurance Cover (₹)

</label>

<input
type="number"
id="insurance"
value="1000000">

</div>

<div class="input-group">

<label>

Outstanding Loan (₹)

</label>

<input
type="number"
id="loan"
value="200000">

</div>

<button id="calculateScore">

Calculate Score

</button>

</div>

<!-- RIGHT -->

<div class="health-result">

<div class="score-card">

<h4>

Financial Score

</h4>

<h1 id="score">

0

</h1>

<p id="status">

Waiting...

</p>

</div>

<div class="recommendation">

<h3>

AI Recommendation

</h3>

<p id="advice">

Fill your financial details
to receive your AI recommendation.

</p>

</div>

</div>

</div>

</div>

</section>

<script src="js/health.js"></script>

</body>

</html>
