<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SIP Calculator | Investment Sarathi</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/calculator.css">

</head>

<body>

<section class="sip-section">

    <div class="container">

        <div class="title">

            <span>Investment Sarathi</span>

            <h1>Professional SIP Calculator</h1>

            <p>
                Calculate your future wealth with Monthly SIP,
                Step-Up SIP and Expected Returns.
            </p>

        </div>

        <div class="calculator-wrapper">

            <!-- LEFT SIDE -->

            <div class="calculator-card">

                <h2>SIP Details</h2>

                <div class="input-group">

                    <label>Monthly SIP (₹)</label>

                    <input
                        type="number"
                        id="sipAmount"
                        value="5000"
                        min="500"
                        step="500">

                </div>

                <div class="input-group">

                    <label>Investment Period (Years)</label>

                    <input
                        type="number"
                        id="years"
                        value="20"
                        min="1"
                        max="40">

                </div>

                <div class="input-group">

                    <label>Expected Return (%)</label>

                    <input
                        type="number"
                        id="returnRate"
                        value="12"
                        step="0.5">

                </div>

                <div class="input-group">

                    <label>Annual SIP Increase (%)</label>

                    <input
                        type="number"
                        id="stepUp"
                        value="10"
                        step="1">

                </div>

                <button id="calculateBtn">

                    Calculate SIP

                </button>

            </div>

            <!-- RIGHT SIDE -->

            <div class="result-card">

                <h2>Investment Summary</h2>

                <div class="result-box">

                    <div>

                        <span>Total Invested</span>

                        <h3 id="invested">

                            ₹0

                        </h3>

                    </div>

                    <div>

                        <span>Estimated Returns</span>

                        <h3 id="returns">

                            ₹0

                        </h3>

                    </div>

                    <div>

                        <span>Future Value</span>

                        <h2 id="futureValue">

                            ₹0

                        </h2>

                    </div>

                </div>

                <canvas id="sipChart"></canvas>

            </div>

        </div>

    </div>

</section>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="js/calculator.js"></script>

</body>

</html>
